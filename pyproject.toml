[project]
name = "video-editor"
version = "0.1.0"
description = "A simple video editing tool which would let me input my podcast video and out comes the edited version."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "torch",
    "ffmpeg-python",
    "moviepy",
    "groq>=0.11.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pydub>=0.25.0",
    "numpy>=1.24.0",
    "sqlmodel>=0.0.22",
    "opencv-python-headless>=4.8.0",
    "yt-dlp>=2024.8.6",
    "manim>=0.18.0",
    "pytesseract>=0.3.10",
    "openai>=1.40.0",
]

# Alternative OCR engines for the gaming K/D/A pass (Settings → K/D/A
# detection). Heavy installs, so they are opt-in extras:
#   uv pip install -e '.[ocr-paddle]'   # PaddleOCR + PaddlePaddle runtime
#   uv pip install -e '.[ocr-easy]'     # EasyOCR (uses the existing torch)
[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]
ocr-easy = [
    "easyocr>=1.7.0",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
